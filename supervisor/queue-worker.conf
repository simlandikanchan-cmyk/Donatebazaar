[program:fundraise-queue-emails]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work redis --sleep=3 --timeout=180 --tries=3 --queue=emails
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/queue-worker-emails.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

