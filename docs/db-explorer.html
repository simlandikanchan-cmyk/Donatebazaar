<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DonateBaazar — Database Architecture Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060a12; --panel:#111a2e; --panel2:#0d1728;
    --stroke:#24355a; --stroke2:#34497a;
    --txt:#eaf1fc; --muted:#92a6c8; --faint:#5a6f96;
    --cyan:#22d3ee; --blue:#5aa2ff; --indigo:#7c8cff; --green:#38e092;
    --amber:#ffc24b; --orange:#ff9a5a; --red:#ff6b81; --violet:#b18cff; --pink:#ff7ac6;
    --grad:linear-gradient(135deg,#22d3ee,#38e092);
    --shadow:0 24px 70px rgba(0,0,0,.5);
    --font:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font);color:var(--txt);line-height:1.5;overflow:hidden;
    background:radial-gradient(1100px 600px at 85% -10%, rgba(34,211,238,.1), transparent 55%),radial-gradient(900px 500px at -8% 20%, rgba(124,140,255,.1), transparent 55%),var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  ::placeholder{color:var(--faint)}

  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(10,16,30,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--stroke)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04231a;font-size:1rem;flex-shrink:0}
  .brand .t{font-weight:800;font-size:1rem;letter-spacing:-.01em}
  .brand .s{font-size:.68rem;color:var(--muted)}
  .searchbox{flex:1;max-width:340px;position:relative}
  .searchbox input{width:100%;background:var(--panel);border:1px solid var(--stroke2);color:var(--txt);padding:9px 14px 9px 36px;border-radius:11px;font-size:.85rem;outline:none;transition:border-color .2s,box-shadow .2s}
  .searchbox input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
  .searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
  .ctl{display:flex;align-items:center;gap:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--txt);border:1px solid var(--stroke2);padding:7px 12px;border-radius:10px;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font);white-space:nowrap}
  .btn:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan)}
  .btn.primary{background:var(--grad);color:#04231a;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08);color:#04231a}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn .kbd{font-family:var(--mono);font-size:.58rem;color:var(--faint);border:1px solid var(--stroke);border-radius:4px;padding:1px 4px}
  .divider{width:1px;height:24px;background:var(--stroke)}
  .spacer{flex:1}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{background:var(--panel);border:1px solid var(--stroke);color:var(--muted);padding:5px 11px;border-radius:999px;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font)}
  .chip:hover{color:var(--txt);border-color:var(--stroke2)}
  .chip.on{background:var(--grad);color:#04231a;border-color:transparent;font-weight:800}

  .flowwrap{position:fixed;top:63px;left:0;right:0;z-index:35;display:flex;gap:8px;align-items:center;overflow-x:auto;padding:9px 18px;background:rgba(8,13,26,.9);border-bottom:1px solid var(--stroke);white-space:nowrap;scrollbar-width:thin}
  .flowwrap::-webkit-scrollbar{height:6px}
  .flowwrap::-webkit-scrollbar-thumb{background:var(--stroke2);border-radius:6px}
  .flowwrap .lbl{font-size:.66rem;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-right:2px;flex-shrink:0}
  .flowchip{background:var(--panel);border:1px solid var(--stroke);color:var(--muted);padding:6px 13px;border-radius:999px;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font);flex-shrink:0}
  .flowchip:hover{color:var(--txt);border-color:var(--cyan)}
  .flowchip.on{background:var(--grad);color:#04231a;border-color:transparent;font-weight:800;box-shadow:0 6px 18px rgba(56,224,146,.25)}
  .flowchip.on .fdot{animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .flowdesc{position:fixed;left:18px;right:18px;bottom:70px;z-index:33;max-width:780px;background:rgba(13,23,40,.94);backdrop-filter:blur(10px);border:1px solid var(--stroke2);border-radius:14px;padding:12px 16px;font-size:.82rem;color:var(--muted);box-shadow:var(--shadow);display:none}
  .flowdesc.show{display:block;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .flowdesc .ft{font-weight:800;color:var(--cyan);font-size:.85rem;margin-bottom:3px}
  .flowdesc .fb b{color:var(--txt)}

  .zoombar{position:fixed;right:18px;bottom:18px;z-index:36;display:flex;flex-direction:column;gap:3px;background:rgba(13,23,40,.92);backdrop-filter:blur(10px);border:1px solid var(--stroke2);border-radius:12px;padding:5px}
  .zbtn{width:38px;height:38px;border:none;background:transparent;color:var(--txt);font-size:1.2rem;cursor:pointer;border-radius:8px;font-family:var(--font);transition:all .15s}
  .zbtn:hover{background:var(--panel);color:var(--cyan)}
  .zlbl{text-align:center;font-size:.62rem;color:var(--faint);font-family:var(--mono);padding:2px 0}

  #stage{position:fixed;top:108px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;touch-action:none}
  #stage.grabbing{cursor:grabbing}
  #vp{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

  .tbox{position:absolute;width:248px;background:var(--panel);border:1px solid var(--stroke2);border-radius:14px;padding:0;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:box-shadow .2s,border-color .2s,opacity .3s,transform .2s;overflow:hidden;user-select:none}
  .tbox:hover{box-shadow:0 16px 40px rgba(0,0,0,.5);border-color:var(--indigo);transform:translateY(-2px)}
  .tbox .th{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--stroke);background:var(--panel2);font-weight:700;font-size:.82rem}
  .tbox .th .ic{width:25px;height:25px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem;background:var(--panel);border:1px solid var(--stroke);flex-shrink:0}
  .tbox .th .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:.75rem}
  .tbox .cols{padding:8px 12px 9px}
  .tbox .col{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.64rem;color:var(--muted);padding:2.5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbox .col .cname{color:var(--txt)}
  .tbox .col .ctype{color:var(--faint)}
  .badge{font-family:var(--mono);font-size:.52rem;font-weight:700;padding:1px 4px;border-radius:4px;flex-shrink:0}
  .b-pk{background:rgba(255,194,75,.15);color:var(--amber);border:1px solid rgba(255,194,75,.4)}
  .b-fk{background:rgba(124,140,255,.15);color:var(--indigo);border:1px solid rgba(124,140,255,.4)}
  .b-uq{background:rgba(56,224,146,.15);color:var(--green);border:1px solid rgba(56,224,146,.4)}
  .b-idx{background:rgba(34,211,238,.12);color:var(--cyan);border:1px solid rgba(34,211,238,.35)}
  .b-n{background:transparent;color:var(--faint);border:1px dashed var(--stroke2)}
  .tbox .more{font-size:.6rem;color:var(--faint);padding:2px 12px 4px;font-family:var(--mono)}
  .tbox .more b{color:var(--muted)}
  .tbox .rel{margin-top:3px;padding:6px 12px;border-top:1px dashed var(--stroke);font-size:.62rem;color:var(--faint);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbox .rel .rl{color:var(--blue)}

  .tbox.dim{opacity:.16;filter:grayscale(.7)}
  .tbox.off{opacity:.05;filter:grayscale(.8)}
  .tbox.hid{display:none}
  .tbox.focus{opacity:1;filter:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--cyan),0 18px 44px rgba(34,211,238,.3);z-index:6}
  .tbox.flowon .th{background:rgba(56,224,146,.10)}
  .tbox.flowon{border-color:var(--green);z-index:5}

  .dom-user .th{border-left:3px solid var(--violet)}
  .dom-camp .th{border-left:3px solid var(--blue)}
  .dom-donat .th{border-left:3px solid var(--cyan)}
  .dom-kyc .th{border-left:3px solid var(--green)}
  .dom-level .th{border-left:3px solid var(--pink)}
  .dom-wallet .th{border-left:3px solid var(--amber)}
  .dom-org .th{border-left:3px solid var(--orange)}
  .dom-support .th{border-left:3px solid var(--indigo)}
  .dom-sys .th{border-left:3px solid var(--faint)}

  svg#edges{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
  .elink{stroke:var(--stroke2);stroke-width:1.5;fill:none;stroke-dasharray:3 3;transition:opacity .3s}
  .elink.on{stroke:var(--cyan);stroke-width:2;stroke-dasharray:none}
  .ecirc{fill:var(--cyan);opacity:0;filter:drop-shadow(0 0 5px var(--cyan))}
  .elbl{fill:var(--faint);font-family:var(--mono);font-size:8.5px;font-weight:600;transition:fill .3s,opacity .3s}
  .elbl.on{fill:var(--cyan)}
  .elbl.mut{opacity:.2}

  .dmaintag{position:absolute;top:-22px;left:14px;font-size:.66rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-family:var(--mono);opacity:.9;pointer-events:none;white-space:nowrap}
  .stats{position:fixed;left:18px;bottom:18px;z-index:36;display:flex;gap:8px;font-size:.66rem;color:var(--faint);font-family:var(--mono);background:rgba(13,23,40,.8);backdrop-filter:blur(8px);border:1px solid var(--stroke);border-radius:10px;padding:6px 12px}
  .stats b{color:var(--cyan);font-weight:600;margin:0 2px}
  .toast{position:fixed;top:176px;left:50%;transform:translateX(-50%);z-index:50;background:var(--panel);color:var(--txt);border:1px solid var(--stroke2);padding:10px 18px;border-radius:12px;font-size:.82rem;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}

  .detail{position:fixed;top:50%;right:18px;transform:translateY(-50%);width:344px;max-height:min(84vh,740px);z-index:45;background:rgba(11,19,34,.97);backdrop-filter:blur(14px);border:1px solid var(--stroke2);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;animation:slideIn .26s ease}
  @keyframes slideIn{from{opacity:0;transform:translate(20px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
  .detail.hide{display:none}
  .d-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--stroke);background:var(--panel2)}
  .d-head .d-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;background:var(--panel);border:1px solid var(--stroke);flex-shrink:0}
  .d-head .d-t{font-weight:800;font-size:1rem;font-family:var(--mono)}
  .d-head .d-m{font-size:.7rem;color:var(--muted);font-family:var(--mono)}
  .d-close{margin-left:auto;background:transparent;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;width:32px;height:32px;border-radius:8px}
  .d-close:hover{background:var(--panel);color:var(--txt)}
  .d-body{padding:6px 16px 16px;overflow-y:auto;font-size:.8rem}
  .d-sec{margin-top:13px}
  .d-sec .st{font-size:.64rem;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .d-purpose{color:var(--muted);line-height:1.55}
  .kv{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.7rem;padding:3px 0;border-bottom:1px dashed rgba(52,73,122,.3)}
  .kv .k{color:var(--faint)}
  .kv .v{color:var(--txt);text-align:right}
  .relrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:.72rem;transition:background .15s}
  .relrow:hover{background:var(--panel)}
  .relrow .rarrow{color:var(--cyan);font-family:var(--mono);font-size:.68rem;width:14px;flex-shrink:0;text-align:center}
  .relrow .rt{color:var(--txt);font-family:var(--mono);font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .relrow .rk{color:var(--faint);font-size:.6rem;margin-left:auto;font-family:var(--mono);flex-shrink:0}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.66rem;font-weight:700;background:var(--panel);border:1px solid var(--stroke);margin-right:5px}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}

  @media (max-width:920px){ .filters{display:none}.searchbox{max-width:170px}.detail{width:300px;right:10px}.brand .s{display:none} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><div class="logo">DB</div><div><div class="t">DonateBaazar</div><div class="s">Database Architecture Explorer</div></div></div>
  <div class="searchbox"><span class="ic">🔍</span><input id="search" type="text" placeholder="Search tables… e.g. wallet, donation, kyc" aria-label="Search tables"></div>
  <div class="filters" id="filters" role="group" aria-label="Domain filters"></div>
  <div class="spacer"></div>
  <div class="ctl">
    <button class="btn" id="fitBtn" title="Fit all tables (F)">Fit <span class="kbd">F</span></button>
    <span class="divider"></span>
    <button class="btn primary" id="playBtn">▶ Play Flow</button>
    <button class="btn" id="pauseBtn" disabled>⏸ Pause</button>
  </div>
</header>

<div class="flowwrap" role="toolbar" aria-label="Business flows">
  <span class="lbl">Flow</span><div id="flowchips" style="display:contents"></div>
</div>

<main id="stage" aria-label="Database diagram canvas"><svg id="edges"></svg><div id="vp"></div></main>

<div class="zoombar" role="group" aria-label="Zoom controls">
  <button class="zbtn" data-z="in" title="Zoom in">+</button>
  <div class="zlbl" id="zoomlbl">—</div>
  <button class="zbtn" data-z="out" title="Zoom out">−</button>
  <button class="zbtn" data-z="reset" title="Reset view" style="font-size:.75rem">⤾</button>
</div>

<div class="flowdesc" id="flowdesc"><div class="ft" id="fd-title"></div><div class="fb" id="fd-body"></div></div>
<div class="stats" id="stats"></div>
<div class="toast" id="toast" role="status"></div>

<aside class="detail hide" id="detail" aria-label="Table details">
  <div class="d-head">
    <div class="d-ic" id="d-ic">📄</div>
    <div><div class="d-t" id="d-title"></div><div class="d-m" id="d-model"></div></div>
    <button class="d-close" id="d-close" aria-label="Close details">×</button>
  </div>
  <div class="d-body" id="d-body"></div>
</aside>

<script>
(function(){
'use strict';
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

var DOMAINS={user:'User & Auth',camp:'Campaigns',donat:'Donations & Payments',kyc:'KYC',level:'Fundraiser Levels',wallet:'Wallet & Settlement',org:'Organizations',support:'Support & Content',sys:'System'};
var DCOL={user:'#b18cff',camp:'#5aa2ff',donat:'#22d3ee',kyc:'#38e092',level:'#ff7ac6',wallet:'#ffc24b',org:'#ff9a5a',support:'#7c8cff',sys:'#5a6f96'};

/* T[id] = {d, ic, purpose, model, pk, meta{}, cols[[name,type,badges]], rels[[to,label,card,fk]]} */
var T={
users:{d:'user',ic:'👤',purpose:'Platform users — fundraisers, donors, volunteers, org admins. Auth via email/password, Google OAuth, or OTP/phone.',model:'User',pk:'id',meta:{Rows:'~ all Orgs/FD','Soft deletes':'No'},
  cols:[['id','bigint','PK'],['name','varchar',''],['email','varchar','UQ'],['role','enum',''],['organization_id','bigint','IDX'],['location_id','bigint','FK'],['phone_verified_at','timestamp','N']],
  rels:[['campaigns','user_id','1:N',1],['donations','user_id','1:N',1],['kyc_verifications','user_id','1:N',1],['user_fundraiser_levels','user_id','1:1',1],['wallets','owner','1:1',1],['organizations','user_id','1:1',1],['activity_logs','user_id','1:N',1],['notification_preferences','user_id','1:N',1],['gift_cards','redeemed_by','1:N',1],['volunteer_applications','user_id','1:N',1],['blogs','author_id','1:N',1]]},
campaigns:{d:'camp',ic:'🎯',purpose:'Core fundraising entity. Lifecycle driven by campaign_state. raised/settled amounts recalc\'d by DB triggers.',model:'Campaign',pk:'id',meta:{'Table':'campaigns','Soft deletes':'Yes','Triggers':'raised_amount'},
  cols:[['id','bigint','PK'],['user_id','bigint','FK'],['category_id','bigint','FK'],['organization_id','bigint','FK,N'],['campaign_state','enum','X'],['goal_amount','decimal',''],['raised_amount','decimal',''],['current_level_id','bigint','FK'],['approved_at','timestamp','N']],
  rels:[['donations','campaign_id','1:N',1],['campaign_media','campaign_id','1:N',1],['campaign_logs','campaign_id','1:N',1],['campaign_settlements','campaign_id','1:N',1],['campaign_updates','campaign_id','1:N',1],['fundraiser_levels','current_level_id','N:1',1],['categories','category_id','N:1',1],['users','user_id','N:1',1],['kyc_verifications','campaign_id','1:N',1]]},
categories:{d:'camp',ic:'🗂️',purpose:'Taxonomy for campaigns & blogs. Supports nested sub-categories.',model:'Category',pk:'id',meta:{'Table':'categories','Parent self-FK':'parent_id'},
  cols:[['id','bigint','PK'],['name','varchar',''],['slug','varchar','UQ'],['parent_id','bigint','FK,N'],['is_active','boolean','']],
  rels:[['campaigns','category_id','1:N',1],['blogs','category_id','1:N',1]]},
campaign_logs:{d:'camp',ic:'📜',purpose:'Audit trail of campaign lifecycle & moderation actions.',model:'CampaignLog',pk:'id',meta:{'Table':'campaign_logs'},
  cols:[['id','bigint','PK'],['campaign_id','bigint','FK'],['type','string',''],['actor_type','string',''],['actor_id','bigint','']],
  rels:[['campaigns','campaign_id','N:1',1]]},
campaign_media:{d:'camp',ic:'🖼️',purpose:'Images, videos & documents attached to a campaign.',model:'—',pk:'id',meta:{'Table':'campaign_media'},
  cols:[['id','bigint','PK'],['campaign_id','bigint','FK'],['type','enum',''],['url','string','']],
  rels:[['campaigns','campaign_id','N:1',1]]},
campaign_updates:{d:'camp',ic:'📢',purpose:'Social updates posted by campaign owners to donors.',model:'CampaignUpdate',pk:'id',meta:{'Table':'campaign_updates'},
  cols:[['id','bigint','PK'],['campaign_id','bigint','FK'],['title','string',''],['body','longText','']],
  rels:[['campaigns','campaign_id','N:1',1]]},
campaign_analytics:{d:'camp',ic:'📈',purpose:'Aggregated view & engagement metrics per campaign by time window.',model:'—',pk:'id',meta:{'Table':'campaign_analytics'},
  cols:[['id','bigint','PK'],['campaign_id','bigint','FK'],['views','bigint',''],['unique_views','bigint',''],['engagement_score','decimal','']],
  rels:[['campaigns','campaign_id','N:1',1]]},
campaign_products:{d:'camp',ic:'🛍️',purpose:'Products offered within a campaign (price, stock, reserved).',model:'CampaignProduct',pk:'id',meta:{'Table':'campaign_products'},
  cols:[['id','bigint','PK'],['campaign_id','bigint','FK'],['name','string',''],['price','decimal',''],['stock','int',''],['reserved_quantity','int','']],
  rels:[['campaigns','campaign_id','N:1',1],['product_reservations','campaign_product_id','1:N',1]]},
donations:{d:'donat',ic:'💸',purpose:'Financial core — money/product/tribute donations. Tracks payment, coupon, settlement & release. receipt_number & payment_id unique.',model:'Donation',pk:'id',meta:{'Table':'donations','payment_status':'pending/completed/failed/refunded/cancelled/processing','settlement_status':'pending/settled/partially_settled/in_review/released'},
  cols:[['id','bigint','PK'],['user_id','bigint','FK,N'],['campaign_id','bigint','FK,X'],['donation_type','enum',''],['total_amount','decimal',''],['platform_fee','decimal',''],['net_amount','decimal',''],['payment_status','enum','X'],['settlement_status','enum',''],['receipt_number','string','UQ'],['payment_gateway','string',''],['coupon_id','bigint','FK,N'],['released_at','timestamp','N']],
  rels:[['campaigns','campaign_id','N:1',1],['users','user_id','N:1',1],['donation_payments','donation_id','1:1',1],['donation_items','donation_id','1:N',1],['settlement_items','donation_id','1:N',1],['refunds','donation_id','1:N',1],['recurring_donations','campaign_id','1:N',0],['coupons','coupon_id','N:1',1]]},

var ALL_IDS=Object.keys(T);
var POS={};

/* ═══════ LAYOUT — one column per domain, stack members ═══════ */
var DOM_ORDER=['user','camp','donat','kyc','level','wallet','org','support','sys'];
function layout(){
  var colX=26,topY=40,colW=320,boxH=170,gapY=22,colY={},colStart={};
  DOM_ORDER.forEach(function(d){colStart[d]=colX;colX+=colW;colY[d]=topY;});
  ALL_IDS.forEach(function(id){
    var d=T[id].d; POS[id]={x:colStart[d],y:colY[d]}; colY[d]+=boxH+gapY;
  });
}

/* ═══════ RENDER DOM ═══════ */
var vp=document.getElementById('vp'), edgesSvg=document.getElementById('edges');
var elMap={};
var EDGE={keyed:{},list:[],paths:{}};

function badgeFor(s){ s=(s||'').split(',')[0].toLowerCase(); return 'b-'+s; }
function buildDom(){
  layout();
  ALL_IDS.forEach(function(id){
    var t=T[id],p=POS[id],e=document.createElement('div');
    e.className='tbox dom-'+t.d;
    e.style.left=p.x+'px'; e.style.top=p.y+'px';
    e.setAttribute('data-id',id); e.setAttribute('role','button'); e.setAttribute('tabindex',0);
    e.setAttribute('aria-label',id+' table ('+DOMAINS[t.d]+')');
    var shown=t.cols.slice(0,5),extra=t.cols.length-5;
    var colsHtml=shown.map(function(c){
      var b=c[2]?('<span class="badge '+badgeFor(c[2])+'">'+shortBadge(c[2])+'</span>'):'';
      return '<div class="col"><span class="cname">'+c[0]+'</span><span class="ctype">'+c[1]+'</span>'+b+'</div>';
    }).join('');
    var more=extra>0?('<div class="more">+ '+extra+' more</div>'):'';
    var rels=(t.rels||[]).slice(0,5).map(function(r){return '<span class="rl">'+r[0]+'</span>';}).join(', ');
    e.innerHTML='<div class="th"><div class="ic">'+t.ic+'</div><div class="nm">'+id+'</div></div>'+
      '<div class="cols">'+colsHtml+'</div>'+more+
      (rels?('<div class="rel">↳ '+rels+'</div>'):'');
    e.addEventListener('click',function(ev){ev.stopPropagation();openDetail(id);});
    e.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDetail(id);} });
    vp.appendChild(e); elMap[id]=e;
  });
  // domain column labels
  DOM_ORDER.forEach(function(d){
    var mem=ALL_IDS.filter(function(id){return T[id].d===d;}); if(!mem.length)return;
    var x=POS[mem[0]].x;
    var tag=document.createElement('div'); tag.className='dmaintag'; tag.style.left=x+'px'; tag.style.top=(-18)+'px';
    tag.style.color=DCOL[d]; tag.textContent=DOMAINS[d].toUpperCase();
    vp.appendChild(tag);
  });
  buildEdges();
  renderStats();
}
function shortBadge(s){ var a=s.split(','); return a[0].toUpperCase()==='PK'?'PK':(a[0].toUpperCase()==='UQ'?'UQ':(a[0].toUpperCase()==='IDX'?'IDX':(a[0].toUpperCase()==='FK'?'FK':(a[0].toUpperCase()==='N'?'NULL':'X')))); }

/* edge keying: undirected pair */
function edgeKey(a,b){ return a<b?a+'|'+b:b+'|'+a; }

function buildEdges(){
  var append=document.createElementNS?document.createElementNS('http://www.w3.org/2000/svg','g'):null;
  ALL_IDS.forEach(function(id){
    var t=T[id]; (t.rels||[]).forEach(function(r){
      var to=r[0]; if(!to||!T[to])return;
      var key=edgeKey(id,to);
      if(EDGE.keyed[key])return; // single line per pair (dedupe reciprocal)
      EDGE.keyed[key]=true;
      var from=POS[id],dst=POS[to];
      if(!from||!dst)return;
      var x1=from.x+248, y1=from.y+32;
      var rightward=dst.x>from.x;
      var x2=rightward?dst.x:dst.x+248, y2=dst.y+32;
      var bend=rightward?0:1;
      var cx=(x1+x2)/2;
      var d='M'+x1+','+y1+' C'+cx+','+y1+','+cx+','+y2+' '+x2+','+y2;
      var info={from:id,to:to,lab:r[1],card:r[2],key:key};
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',d); path.setAttribute('class','elink');
      var lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
      lbl.setAttribute('class','elbl');
      lbl.textContent=r[2]+' '+r[1];
      lbl.setAttribute('x',''+((x1+x2)/2)); lbl.setAttribute('y',''+((y1+y2)/2-6));
      var circ=document.createElementNS('http://www.w3.org/2000/svg','circle');
      circ.setAttribute('class','ecirc'); circ.setAttribute('r',4);
      edgesSvg.appendChild(path); edgesSvg.appendChild(lbl);
      info.path=path; info.lbl=lbl; info.circ=circ;
      EDGE.list.push(info); EDGE.paths[key]=info;
      edgesSvg.appendChild(circ);
    });
  });
}

/* ═══════ ZOOM / PAN ═══════ */
var stage=document.getElementById('stage');
var scale=1,tx=0,ty=0;
function apply(){ vp.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; document.getElementById('zoomlbl').textContent=Math.round(scale*100)+'%'; }
function fit(){
  var W=stage.clientWidth,H=stage.clientHeight,minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  ALL_IDS.forEach(function(id){var p=POS[id];if(p.x<minX)minX=p.x;if(p.x+248>maxX)maxX=p.x+248;if(p.y<minY)minY=p.y;if(p.y+170>maxY)maxY=p.y+170;});
  var bw=maxX-minX,bh=maxY-minY;
  scale=Math.min((W-70)/bw,(H-70)/bh,1.15); if(scale<0.2)scale=0.2;
  tx=(W-bw*scale)/2-minX*scale; ty=(H-bh*scale)/2-minY*scale; apply();
}
function zoomBy(f,px,py){
  var old=scale; scale=Math.max(0.2,Math.min(3,scale*f)); var k=scale/old;
  tx=px-(px-tx)*k; ty=py-(py-ty)*k; apply();
}
var dragging=false,sx=0,sy=0,stx=0,sty=0;
stage.addEventListener('mousedown',function(e){
  if(e.target.closest('.tbox'))return; dragging=true; sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;stage.classList.add('grabbing');
});
window.addEventListener('mousemove',function(e){ if(!dragging)return; tx=stx+(e.clientX-sx); ty=sty+(e.clientY-sy); apply(); });
window.addEventListener('mouseup',function(){ dragging=false; stage.classList.remove('grabbing'); });
stage.addEventListener('wheel',function(e){ e.preventDefault(); zoomBy(Math.exp(-e.deltaY*0.0015), e.clientX, e.clientY); },{passive:false});
stage.addEventListener('touchstart',function(e){ if(e.touches.length===1){dragging=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;stx=tx;sty=ty;} },{passive:true});
stage.addEventListener('touchmove',function(e){ if(!dragging||e.touches.length!==1)return; e.preventDefault(); tx=stx+(e.touches[0].clientX-sx); ty=sty+(e.touches[0].clientY-sy); apply(); },{passive:false});
stage.addEventListener('touchend',function(){ dragging=false; });

/* ═══════ FILTERS ═══════ */
var filtersEl=document.getElementById('filters');
var activeDomains={};
function buildFilters(){
  var chips=[['All','']];
  DOM_ORDER.forEach(function(d){ chips.push([DOMAINS[d],d]); });
  filtersEl.innerHTML=chips.map(function(c){
    return '<button class="chip'+(c[1]===''?' on':'')+'" data-d="'+c[1]+'">'+c[0]+'</button>';
  }).join('');
  filtersEl.addEventListener('click',function(e){
    var b=e.target.closest('.chip'); if(!b)return;
    var d=b.dataset.d;
    filtersEl.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    Object.keys(activeDomains).forEach(function(k){delete activeDomains[k];});
    if(d)activeDomains[d]=true;
    resetSearch(); applyVisibility();
  });
}
function resetSearch(){ search.value=''; }

function applyVisibility(){
  var q=(search.value||'').trim().toLowerCase();
  var dimOthers=(q.length>0)||Object.keys(activeDomains).length>0;
  var activeFlowId=currentFlow;
  var flowTables = activeFlowId && activeFlowId!=='overview' ? (FLOWS[activeFlowId]?FLOWS[activeFlowId].tables:[]) : null;
  ALL_IDS.forEach(function(id){
    var e=elMap[id],t=T[id];
    var matches=q? (id.toLowerCase().indexOf(q)>-1 || t.purpose.toLowerCase().indexOf(q)>-1 || (t.cols||[]).some(function(c){return c[0].toLowerCase().indexOf(q)>-1;})) : true;
    var domOk=Object.keys(activeDomains).length===0 || activeDomains[t.d];
    var flowOk= flowTables ? flowTables.indexOf(id)>-1 : true;
    var vis=matches&&domOk&&flowOk;
    e.classList.toggle('hid',!vis);
    e.classList.toggle('dim', vis && dimOthers && !(q&&matches&&id.indexOf(q)>-1) && !(flowTables&&flowTables.indexOf(id)>-1));
    e.classList.remove('focus');
    if(q && id.indexOf(q)>-1){ e.classList.add('focus'); }
  });
  // edges
  EDGE.list.forEach(function(en){
    var bothVisible=flowTables? (flowTables.indexOf(en.from)>-1&&flowTables.indexOf(en.to)>-1) : true;
    var hasQ=q&&(String(en.from).toLowerCase().indexOf(q)>-1||String(en.to).toLowerCase().indexOf(q)>-1);
    en.path.setAttribute('opacity', bothVisible?(hasQ?'1':'0.7'):'1');
    en.lbl.setAttribute('opacity', bothVisible?(hasQ?'1':'0.8'):'1');
    en.circ.setAttribute('opacity','0');
  });
  if(activeFlowId&&activeFlowId!=='overview'&&!q&&Object.keys(activeDomains).length===0){
    // highlight edges among flow tables
    EDGE.list.forEach(function(en){
      var inF=flowTables.indexOf(en.from)>-1&&flowTables.indexOf(en.to)>-1;
      if(inF){ en.path.classList.add('on'); en.lbl.classList.add('on'); } else { en.path.classList.remove('on'); en.lbl.classList.remove('on'); }
    });
  } else {
    EDGE.list.forEach(function(en){ en.path.classList.remove('on'); en.lbl.classList.remove('on'); });
  }
}

/* ═══════ FLOWS ═══════ */
var FLOWS={
overview:{name:'Database Overview',desc:'All '+ALL_IDS.length+' confirmed tables grouped by domain. Pick any flow chip below to animate the related tables.',tables:null,seq:[]},
campaign:{name:'Campaign Flow',desc:'<b>users</b> (fundraiser) → <b>campaigns</b> (lifecycle via <b>campaign_state</b>) → attached <b>media / updates / logs / analytics</b> → public donations. Taxonomy via <b>categories</b>, optional <b>organization</b>, level gates via <b>current_level_id</b>.',tables:['users','categories','campaigns','campaign_media','campaign_updates','campaign_logs','campaign_analytics','campaign_products'],seq:['users','campaigns','campaign_media','campaign_updates','campaign_logs'],mode:'seq'},
donation:{name:'Donation Flow',desc:'<b>users</b> / guest → <b>campaigns</b> → <b>donations</b> → line <b>donation_items</b> → gateway <b>donation_payments</b>; <b>coupons/coupon_redemptions</b>, <b>recurring_donations</b>, <b>gift_cards</b> & <b>product_reservations</b> support the journey.',tables:['users','campaigns','donations','donation_items','donation_payments','coupons','coupon_redemptions','recurring_donations','gift_cards','product_reservations','campaign_products'],seq:['users','campaigns','donations','donation_items','donation_payments'],mode:'seq'},
payment:{name:'Payment Flow',desc:'<b>donations</b> → gateway <b>donation_payments</b> (Razorpay order/verify/webhook) → <b>product_reservations</b> for product stock → success completes & issues receipt; failure path → <b>refunds</b>.',tables:['donations','donation_payments','product_reservations','refunds','campaign_products'],seq:['donations','donation_payments','refunds'],mode:'seq'},
kyc:{name:'KYC Flow',desc:'DATABASE: <b>users</b> → <b>kyc_verifications</b>. BUSINESS RULE: an approved record makes the user KYC-approved across campaigns (one approval authorizes all) → gate on <b>campaigns</b> publication / resume. campaign_id is optional per-campaign linkage only.',tables:['users','kyc_verifications','campaigns'],seq:['users','kyc_verifications','campaigns'],mode:'seq',important:true},
level:{name:'Fundraiser Level Flow',desc:'New <b>users</b> → default <b>fundraiser_levels</b> (is_default) → assigned in <b>user_fundraiser_levels</b> (UNIQUE user) → <b>fundraiser_level_history</b> logs changes (NO automatic promotion — admin/application driven) → ceilings campaign limits.',tables:['users','fundraiser_levels','user_fundraiser_levels','fundraiser_level_history','campaigns'],seq:['users','user_fundraiser_levels','fundraiser_levels','fundraiser_level_history'],mode:'seq'},
wallet:{name:'Wallet Flow',desc:'Completed <b>donations</b> credit the owner <b>wallets</b> → <b>wallet_transactions</b> ledger (event sourcing) → funds initially <b>reserved</b> 7 days → <b>refunds</b> trigger reversals → mature to available balance → later payout.',tables:['donations','wallets','wallet_transactions','refunds'],seq:['donations','wallets','wallet_transactions','refunds'],mode:'seq'},
settlement:{name:'Settlement Flow',desc:'<b>donations</b> aggregations recorded in <b>settlement_items</b> → joined into <b>campaign_settlements</b> → <b>risk_scores</b> (AML thresholds) → state machine via <b>settlement_state_logs</b> → approved for payout.',tables:['donations','settlement_items','campaign_settlements','risk_scores','risk_rules','risk_rule_logs','settlement_state_logs','risk_config'],seq:['donations','settlement_items','campaign_settlements','risk_scores','settlement_state_logs'],mode:'seq'},
payout:{name:'Payout Flow',desc:'Approved <b>campaign_settlements</b> → verified <b>payout_accounts</b> → <b>payout_attempts</b> (unique idempotency) → gateway payout → <b>settlement_items</b> marked settled & donations released. Failed attempts retry then restore funds.',tables:['campaign_settlements','payout_accounts','payout_attempts','settlement_items','organizations','donations'],seq:['campaign_settlements','payout_accounts','payout_attempts','settlement_items'],mode:'seq'},
org:{name:'Organization Flow',desc:'<b>users</b> → <b>organization_applications</b> → review → <b>organizations</b> (UNIQUE owner) → contacts & certifications → owns campaigns → receives <b>campaign_settlements</b> → verified <b>payout_accounts</b>.',tables:['users','organization_applications','organizations','organization_contacts','organization_certifications','campaigns','payout_accounts','campaign_settlements'],seq:['users','organization_applications','organizations','organization_contacts','organization_certifications'],mode:'seq'}
};
var currentFlow='overview',flowPlaying=false,flowSeqTimer=null,flowSeqIdx=-1;

function buildFlowChips(){
  document.getElementById('flowchips').innerHTML=Object.keys(FLOWS).map(function(k){
    return '<button class="flowchip'+(k==='overview'?' on':'')+'" data-f="'+k+'"><span class="fdot"></span>'+FLOWS[k].name+'</button>';
  }).join('');
  document.getElementById('flowchips').addEventListener('click',function(e){
    var b=e.target.closest('.flowchip'); if(!b)return;
    var f=b.dataset.f;
    document.getElementById('flowchips').querySelectorAll('.flowchip').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    stopFlow(true);
    selectFlow(f);
  });
}
function selectFlow(f){
  currentFlow=f;
  var fd=document.getElementById('flowdesc');
  if(f==='overview'){ fd.classList.remove('show'); }
  else { document.getElementById('fd-title').textContent=FLOWS[f].name; document.getElementById('fd-body').innerHTML=FLOWS[f].desc; fd.classList.add('show'); }
  applyVisibility();
  renderStats();
}
/* animate sequence: highlight each table then its edges */
function playFlow(){
  var f=currentFlow;
  stopFlowImpl(false);
  var seq=FLOWS[f].seq;
  if(!seq||!seq.length){ toastMsg('No sequential animation for this flow — tables highlighted.'); return; }
  flowPlaying=true; flowSeqIdx=-1;
  document.getElementById('playBtn').disabled=true; document.getElementById('pauseBtn').disabled=false;
  // focus flow tables
  ALL_IDS.forEach(function(id){ var e=elMap[id]; if(FLOWS[f].tables&&FLOWS[f].tables.indexOf(id)>-1){ e.classList.add('flowon');} else {e.classList.add('off');} });
  function step(){
    if(!flowPlaying)return;
    flowSeqIdx++;
    if(flowSeqIdx>=seq.length){ finishFlow(); return; }
    var cur=seq[flowSeqIdx];
    var e=elMap[cur]; if(e){ e.classList.remove('off'); e.classList.add('focus'); scrollCellIntoView(cur); }
    // light edges from cur to next in seq
    if(flowSeqIdx>0){ var prev=seq[flowSeqIdx-1]; var k=edgeKey(prev,cur); var en=EDGE.paths[k]; if(en){ en.path.classList.add('on'); en.lbl.classList.add('on'); lightParticle(en); } }
    if(reduceMotion){ setTimeout(step,400); } else { setTimeout(step, reduceMotion?500:760); }
  }
  step();
}
function lightParticle(en){
  var c=en.circ; c.setAttribute('opacity','1');
  c.style.animation='none'; void c.getBBox ? '' : ''; // trigger reflow
  // animate along path via SMIL-free approach: set motion using path length with rAF is heavy; simple pulse instead
  if(!reduceMotion){ c.style.transition='opacity 1.2s'; setTimeout(function(){c.setAttribute('opacity','0');},1300); }
}
function scrollCellIntoView(id){
  var e=elMap[id]; if(!e)return;
  var r=e.getBoundingClientRect();
  var sr=stage.getBoundingClientRect();
  if(r.left<sr.left||r.right>sr.right||r.top<sr.top||r.bottom>sr.bottom){
    // center via translate
    var p=POS[id]; var cx=stage.clientWidth/2, cy=stage.clientHeight/2;
    tx=cx-p.x*scale-124; ty=cy-p.y*scale-85; apply();
  }
}
function finishFlow(){ flowPlaying=false; flowSeqTimer=null; flowSeqIdx=-1; document.getElementById('playBtn').disabled=false; document.getElementById('pauseBtn').disabled=true; }
function stopFlow(clear){ stopFlowImpl(clear); }
function stopFlowImpl(clear){
  flowPlaying=false; if(flowSeqTimer){clearTimeout(flowSeqTimer);flowSeqTimer=null;}
  document.getElementById('playBtn').disabled=false; document.getElementById('pauseBtn').disabled=true;
  if(clear){
    ALL_IDS.forEach(function(id){ var e=elMap[id]; e.classList.remove('focus','off','flowon'); });
    EDGE.list.forEach(function(en){ en.path.classList.remove('on'); en.lbl.classList.remove('on'); en.circ.setAttribute('opacity','0'); });
    applyVisibility(); // reapply current filters/search
  }
}

/* ═══════ DETAIL PANEL ═══════ */
var detail=document.getElementById('detail');
function openDetail(id){
  var t=T[id];
  document.getElementById('d-ic').textContent=t.ic;
  document.getElementById('d-title').textContent=id;
  document.getElementById('d-model').textContent='Model: '+(t.model||'—');
  var h='<div class="d-sec"><div class="st">Purpose</div><div class="d-purpose">'+t.purpose+'</div></div>';
  h+='<div class="d-sec"><div class="st">Key facts</div>'+
     '<div class="kv"><span class="k">Primary key</span><span class="v">'+t.pk+'</span></div>'+
     '<div class="kv"><span class="k">Domain</span><span class="v">'+DOMAINS[t.d]+'</span></div>'+
     Object.keys(t.meta||{}).map(function(k){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+t.meta[k]+'</span></div>';}).join('')+
     '</div>';
  h+='<div class="d-sec"><div class="st">Columns</div>';
  t.cols.forEach(function(c){
    var badges=(c[2]||'').split(',').filter(Boolean).map(function(b){return '<span class="pill" style="color:var(--'+(b==='FK'?'indigo':b==='PK'?'amber':b==='UQ'?'green':b==='IDX'?'cyan':'faint')+')">'+b+'</span>';}).join('');
    h+='<div class="kv"><span class="k">'+c[0]+'</span><span class="v">'+c[1]+' '+badges+'</span></div>';
  });
  h+='</div>';
  // relations both ways
  var out=(t.rels||[]).map(function(r){ if(!T[r[0]])return null; return {to:r[0],lab:r[1],card:r[2]}; }).filter(Boolean);
  var inc=[]; ALL_IDS.forEach(function(o){ (T[o].rels||[]).forEach(function(r){ if(r[0]===id && o!==id) inc.push({to:o,lab:r[1],card:r[2]}; }); });
  if(out.length){
    h+='<div class="d-sec"><div class="st">References (out)</div>';
    out.forEach(function(r){ h+='<div class="relrow" data-go="'+r.to+'"><span class="rarrow">→</span><span class="rt">'+r.to+'</span><span class="rk">'+r.card+' · '+r.lab+'</span></div>'; });
    h+='</div>';
  }
  if(inc.length){
    h+='<div class="d-sec"><div class="st">Referenced by (in)</div>';
    inc.forEach(function(r){ h+='<div class="relrow" data-go="'+r.to+'"><span class="rarrow">←</span><span class="rt">'+r.to+'</span><span class="rk">'+r.card+'</span></div>'; });
    h+='</div>';
  }
  document.getElementById('d-body').innerHTML=h;
  detail.classList.remove('hide');
  // relrow navigation
  document.getElementById('d-body').querySelectorAll('.relrow').forEach(function(rc){
    rc.addEventListener('click',function(){ var go=rc.getAttribute('data-go'); if(go) openDetail(go); });
  });
}
document.getElementById('d-close').addEventListener('click',function(){ detail.classList.add('hide'); });

/* ═══════ TOAST / STATS ═══════ */
var toastEl=document.getElementById('toast'),toastTimer=null;
function toastMsg(m){ toastEl.textContent=m; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2200); }
function renderStats(){
  var relCount=EDGE.list.length;
  document.getElementById('stats').innerHTML='<span>TABLES <b>'+ALL_IDS.length+'</b></span><span>|</span><span>REL <b>'+relCount+'</b></span><span>|</span><span>FLOWS <b>'+Object.keys(FLOWS).length+'</b></span>';
}

/* ═══════ SEARCH ═══════ */
var search=document.getElementById('search');
search.addEventListener('input',function(){ applyVisibility(); });
search.addEventListener('keydown',function(e){ if(e.key==='Enter'&&search.value){ toastMsg('Showing matches for "'+search.value+'"'); } });

/* ═══════ CONTROLS ═══════ */
document.querySelectorAll('.zbtn').forEach(function(b){
  b.addEventListener('click',function(){
    var z=b.dataset.z, W=stage.clientWidth/2,H=stage.clientHeight/2;
    if(z==='in')zoomBy(1.25,W,H); else if(z==='out')zoomBy(0.8,W,H); else if(z==='reset'){scale=1;tx=0;ty=0;apply();}
  });
});
document.getElementById('fitBtn').addEventListener('click',fit);
document.getElementById('playBtn').addEventListener('click',playFlow);
document.getElementById('pauseBtn').addEventListener('click',function(){ stopFlow(true); toastMsg('Flow paused.'); });
window.addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){ fit(); }
  else if(e.key==='Escape'){ detail.classList.add('hide'); stopFlow(true); }
  else if(e.key===' ') { e.preventDefault(); if(flowPlaying)stopFlow(true); else playFlow(); }
});

/* ═══════ INIT ═══════ */
buildDom();
buildFilters();
buildFlowChips();
fit();
renderStats();
applyVisibility();

})();
</script>
